[package]
name = "nkf"
version = "0.1.0"
description = "NKF (NightKnight Files) — Fast, modern, dual-pane FOSS File Manager"
authors = ["NightKnight Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "nkf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
walkdir = "2"
trash = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"

[features]
custom-protocol = ["tauri/custom-protocol"]
